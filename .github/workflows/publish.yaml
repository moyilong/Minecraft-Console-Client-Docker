name: Publish as Container Image

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Get latest release tag
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --repo MCCTeam/Minecraft-Console-Client --json tagName -q .tagName)
          echo "tag=$latest" >> "$GITHUB_OUTPUT"

      - name: Compare with last known release
        id: compare
        run: |
          state_file="release-mark.txt"
          old_tag=""

          if [ -f "$state_file" ]; then
            old_tag=$(cat "$state_file")
          fi

          new_tag="${{ steps.latest.outputs.tag }}"

          echo "old=$old_tag"
          echo "new=$new_tag"

          if [ "$old_tag" != "$new_tag" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        if: steps.compare.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'

      - name: Log in to GHCR
        uses: docker/login-action@v2
        if: steps.compare.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@v6
        if: steps.compare.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        with:
          dotnet-version: '10.0'

      - name: Clone & Build
        if: steps.compare.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git clone https://github.com/MCCTeam/Minecraft-Console-Client -b ${{ steps.latest.outputs.tag }} --recursive Minecraft-Console-Client;
          dotnet build -o ./app -c Release Minecraft-Console-Client/MinecraftClient/MinecraftClient.csproj

      - name: Build docker and push to GHCR
        uses: docker/build-push-action@v7
        if: steps.compare.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        with:
          context: .
          push: true
          platforms: linux/amd64, linux/arm64/v8
          tags: |
            ghcr.io/${{ github.repository_owner }}/minecraft-console-client:latest
            ghcr.io/${{ github.repository_owner }}/minecraft-console-client:${{ steps.latest.outputs.tag }}
          build-args: |
            RELEASE_TAG=${{ steps.latest.outputs.tag }}


      - name: Save latest release tag
        if: steps.compare.outputs.changed == 'true'
        run: |
          mkdir -p .github
          echo "${{ steps.latest.outputs.tag }}" > release-mark.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add release-mark.txt
          git commit -m "Update external release tag to ${{ steps.latest.outputs.tag }}" || exit 0
          git push